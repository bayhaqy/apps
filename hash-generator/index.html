  <script src="/apps/assets/app-shell.js?v=20260831c" data-app-name="Hash Generator"></script>
  <!-- crypto-js for MD5 and SHA-1 (Web Crypto API does not support these) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var textMode = $('#textMode');
      var fileMode = $('#fileMode');
      var textInput = $('#textInput');
      var fileInput = $('#fileInput');
      var fileMeta = $('#fileMeta');
      var hashBtn = $('#hashBtn');
      var copyAllBtn = $('#copyAllBtn');
      var resultCard = $('#resultCard');
      var hashList = $('#hashList');

      document.querySelectorAll('input[name="mode"]').forEach(function (r) {
        r.addEventListener('change', function () {
          var v = document.querySelector('input[name="mode"]:checked').value;
          textMode.style.display = v === 'text' ? 'block' : 'none';
          fileMode.style.display = v === 'file' ? 'block' : 'none';
        });
      });

      function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
      function bufToHex(buf) {
        var bytes = new Uint8Array(buf);
        var hex = '';
        for (var i = 0; i < bytes.length; i++) hex += bytes[i].toString(16).padStart(2, '0');
        return hex;
      }
      async function subtleDigest(algo, data) {
        var hashBuf = await crypto.subtle.digest(algo, data);
        return bufToHex(hashBuf);
      }

      function renderRow(name, hex, deprecated) {
        var id = 'hash-' + name.toLowerCase().replace(/[^a-z0-9]/g, '');
        return '<div style="margin-bottom:1rem;">' +
          '<div class="flex-between mb-0">' +
            '<span class="text-sm" style="font-weight:600;">' + escapeHtml(name) +
              (deprecated ? ' <span class="pill" style="margin-left:0.5rem;">deprecated</span>' : '') +
            '</span>' +
            '<button class="btn btn-ghost" type="button" data-copy-target="' + id + '" style="padding:0.3rem 0.7rem; font-size:0.8rem;">Copy</button>' +
          '</div>' +
          '<code id="' + id + '" class="text-mono text-sm" style="display:block; word-break:break-all; background:var(--paper-alt); border:1px solid var(--line); border-radius:6px; padding:0.6rem 0.75rem;">' + escapeHtml(hex) + '</code>' +
        '</div>';
      }

      async function hashBytes(bytes) {
        var results = [];
        // MD5 via crypto-js
        try {
          var words = CryptoJS.lib.WordArray.create(bytes);
          var md5 = CryptoJS.MD5(words).toString();
          results.push({ name: 'MD5', hex: md5, deprecated: true });
        } catch (e) { results.push({ name: 'MD5', hex: 'Error: ' + (e.message || e), deprecated: true }); }
        // SHA-1 via crypto-js (Web Crypto supports it too, but be consistent).
        try {
          var words2 = CryptoJS.lib.WordArray.create(bytes);
          var sha1 = CryptoJS.SHA1(words2).toString();
          results.push({ name: 'SHA-1', hex: sha1, deprecated: true });
        } catch (e) { results.push({ name: 'SHA-1', hex: 'Error: ' + (e.message || e), deprecated: true }); }
        // SHA-256 / 384 / 512 via Web Crypto API
        try { results.push({ name: 'SHA-256', hex: await subtleDigest('SHA-256', bytes) }); } catch (e) { results.push({ name: 'SHA-256', hex: 'Error: ' + (e.message || e) }); }
        try { results.push({ name: 'SHA-384', hex: await subtleDigest('SHA-384', bytes) }); } catch (e) { results.push({ name: 'SHA-384', hex: 'Error: ' + (e.message || e) }); }
        try { results.push({ name: 'SHA-512', hex: await subtleDigest('SHA-512', bytes) }); } catch (e) { results.push({ name: 'SHA-512', hex: 'Error: ' + (e.message || e) }); }
        return results;
      }

      async function run() {
        resultCard.style.display = 'block';
        hashList.innerHTML = '<p class="text-mute text-sm">Hashing…</p>';
        try {
          var mode = document.querySelector('input[name="mode"]:checked').value;
          var bytes;
          if (mode === 'text') {
            var text = textInput.value;
            bytes = new TextEncoder().encode(text);
          } else {
            var f = fileInput.files && fileInput.files[0];
            if (!f) { hashList.innerHTML = '<p class="text-red text-sm">Please select a file.</p>'; return; }
            fileMeta.textContent = f.name + ' · ' + f.size.toLocaleString() + ' bytes · ' + (f.type || 'unknown type');
            var ab = await f.arrayBuffer();
            bytes = new Uint8Array(ab);
          }
          var results = await hashBytes(bytes);
          hashList.innerHTML = results.map(function (r) { return renderRow(r.name, r.hex, r.deprecated); }).join('');
        } catch (e) {
          hashList.innerHTML = '<p class="text-red text-sm">Error: ' + escapeHtml(e.message || String(e)) + '</p>';
        }
      }

      hashBtn.addEventListener('click', run);
      textInput.addEventListener('input', function () { if (resultCard.style.display === 'block') run(); });

      // Delegate copy buttons.
      hashList.addEventListener('click', function (e) {
        var btn = e.target.closest('button[data-copy-target]');
        if (!btn) return;
        var id = btn.getAttribute('data-copy-target');
        var el = document.getElementById(id);
        if (!el) return;
        window.copyText(el.textContent).then(function (ok) { window.showToast(ok ? 'Copied' : 'Copy failed'); });
      });

      copyAllBtn.addEventListener('click', function () {
        var lines = [];
        hashList.querySelectorAll('code').forEach(function (el) {
          var name = el.previousElementSibling ? '' : '';
          var labelEl = el.closest('div').querySelector('.text-sm');
          lines.push((labelEl ? labelEl.textContent.replace('Copy','').trim() : 'HASH') + ':  ' + el.textContent);
        });
        window.copyText(lines.join('\n')).then(function (ok) { window.showToast(ok ? 'All hashes copied' : 'Copy failed'); });
      });

      // Auto-run on load.
      setTimeout(run, 150);
    })();
  </script>
</body>
