<body data-app-name="URL Parser">
  <main class="app-main">
    <header class="app-hero">
      <p class="app-eyebrow">Network · HTTP</p>
      <h1 class="app-title">URL Parser &amp; <span class="accent">HTTP Header Checker</span></h1>
      <p class="app-subtitle">
        Break any URL into protocol, host, port, path, and query parameters, then optionally
        fetch the response headers via a public CORS proxy to inspect server, cache, and security headers.
      </p>
    </header>

    <section class="card">
      <label class="field">
        <span>URL</span>
        <input type="url" id="urlInput" placeholder="https://example.com/path?key=value" value="https://example.com/path?key=value" autocapitalize="none" spellcheck="false" />
        <span class="hint">URL components are parsed locally in your browser (no network call). Header fetching uses a public CORS proxy.</span>
      </label>
      <div class="btn-row">
        <button class="btn btn-primary" id="parseBtn" type="button">Parse URL</button>
        <button class="btn btn-ghost" id="fetchBtn" type="button">Fetch headers</button>
        <button class="btn btn-ghost" id="sampleBtn" type="button">Try sample</button>
      </div>
    </section>

  <script src="/apps/assets/app-shell.js?v=20260831b" data-app-name="URL Parser"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var urlInput = $('#urlInput');
      var parseBtn = $('#parseBtn');
      var fetchBtn = $('#fetchBtn');
      var sampleBtn = $('#sampleBtn');
      var parseCard = $('#parseCard');
      var parseTable = $('#parseTable');
      var headerCard = $('#headerCard');
      var headerTable = $('#headerTable');
      var statusCard = $('#statusCard');
      var statusBody = $('#statusBody');
      var errorCard = $('#errorCard');
      var errorMsg = $('#errorMsg');

      function clearOutput() { parseCard.style.display='none'; headerCard.style.display='none'; statusCard.style.display='none'; errorCard.style.display='none'; }
      function showError(m) { clearOutput(); errorCard.style.display='block'; errorMsg.textContent = m; }
      function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
      function row(k, v, cls) { return '<tr><td class="k">' + escapeHtml(k) + '</td><td class="v' + (cls ? ' ' + cls : '') + '">' + escapeHtml(v) + '</td></tr>'; }
      function statusPill(code) {
        var cls = 'pill';
        if (code >= 200 && code < 300) cls += ' green';
        else if (code >= 400) cls += '';
        else cls += ' muted';
        return '<span class="' + cls + '">' + code + '</span>';
      }

      function parseURL() {
        clearOutput();
        var raw = urlInput.value.trim();
        if (!raw) { showError('Enter a URL.'); return; }
        try {
          var u = new URL(raw);
          var rows = '';
          rows += row('Protocol', u.protocol);
          rows += row('Username', u.username || '—');
          rows += row('Password', u.password ? '•••••' : '—');
          rows += row('Host', u.hostname);
          rows += row('Port', u.port || (u.protocol === 'https:' ? '443 (default)' : u.protocol === 'http:' ? '80 (default)' : '—'));
          rows += row('Path', u.pathname || '/');
          rows += row('Hash / fragment', u.hash || '—');
          rows += row('Search string', u.search || '—');
          rows += row('Origin', u.origin);
          parseTable.innerHTML = '<tbody>' + rows + '</tbody>';

          // Query parameters as separate table.
          var params = u.searchParams;
          var pkeys = [];
          params.forEach(function (v, k) { pkeys.push([k, v]); });
          if (pkeys.length > 0) {
            var pRows = pkeys.map(function (kv) { return row(kv[0], kv[1]); }).join('');
            parseTable.innerHTML += '<tbody><tr><td colspan="2" style="padding-top:1rem; background:var(--paper-alt); font-weight:600;">Query parameters</td></tr>' + pRows + '</tbody>';
          }

          // Quick security checks.
          var sec = [];
          if (u.protocol === 'https:') sec.push('<span class="pill green">HTTPS</span>');
          else if (u.protocol === 'http:') sec.push('<span class="pill">Insecure HTTP</span>');
          // Look for suspicious patterns in params.
          var suspiciousKeys = ['token','password','passwd','pwd','secret','api_key','apikey','access_token'];
          var foundSusp = [];
          params.forEach(function (v, k) {
            var lk = k.toLowerCase();
            if (suspiciousKeys.indexOf(lk) !== -1) foundSusp.push(k);
          });
          if (foundSusp.length > 0) sec.push('<span class="pill">Sensitive param: ' + escapeHtml(foundSusp.join(', ')) + '</span>');

          statusBody.innerHTML = '<div class="flex-c">' + sec.join('') + '</div>';
          statusCard.style.display = 'block';
          parseCard.style.display = 'block';
        } catch (e) {
          showError('Invalid URL: ' + (e.message || e) + '. Make sure to include the protocol (https:// or http://).');
        }
      }

      async function fetchHeaders() {
        clearOutput();
        var raw = urlInput.value.trim();
        if (!raw) { showError('Enter a URL.'); return; }
        var target;
        try { target = new URL(raw); } catch (e) { showError('Invalid URL: ' + (e.message || e)); return; }
        if (target.protocol !== 'https:' && target.protocol !== 'http:') { showError('Only http/https URLs can be fetched.'); return; }

        parseCard.style.display = 'block';
        parseTable.innerHTML = '<tbody><tr><td class="k">Fetching…</td><td class="v">via public CORS proxy</td></tr></tbody>';
        headerCard.style.display = 'block';
        headerTable.innerHTML = '<tbody><tr><td colspan="2" class="text-mute">Loading response headers…</td></tr></tbody>';
        statusCard.style.display = 'block';
        statusBody.innerHTML = '<p class="text-mute text-sm">Sending request through <span class="text-mono">corsproxy.io</span>…</p>';

        try {
          // Use corsproxy.io — a free, public CORS proxy that forwards headers.
          var proxied = 'https://corsproxy.io/?url=' + encodeURIComponent(target.href);
          var res = await fetch(proxied, { method: 'GET', redirect: 'follow' });
          // Parse URL components first (for context).
          parseURL();
          parseCard.style.display = 'block';

          // Status line.
          var ok = res.ok;
          statusBody.innerHTML = '<div class="flex-c">' + statusPill(res.status) + '<span class="text-sm">' + escapeHtml(res.statusText || '') + '</span><span class="pill muted">' + escapeHtml(res.type || '') + '</span></div>';

          // Headers.
          var rows = '';
          var headers = [];
          res.headers.forEach(function (v, k) { headers.push([k, v]); });
          if (headers.length === 0) {
            rows = '<tr><td colspan="2" class="text-mute text-c" style="padding:1rem;">No headers exposed by the proxy.</td></tr>';
          } else {
            headers.sort(function (a, b) { return a[0].localeCompare(b[0]); });
            headers.forEach(function (h) {
              var cls = '';
              var lk = h[0].toLowerCase();
              if (lk === 'set-cookie' || lk === 'authorization') cls = 'text-red';
              rows += row(h[0], h[1], cls);
            });
          }
          headerTable.innerHTML = '<tbody><tr><th style="width:40%;">Header</th><th>Value</th></tr></tbody>' + rows;
        } catch (e) {
          headerTable.innerHTML = '<tbody><tr><td colspan="2" class="text-red">Fetch failed: ' + escapeHtml(e.message || String(e)) + '</td></tr></tbody>';
          statusBody.innerHTML = '<p class="text-red text-sm">The public CORS proxy may be down or the target blocked the request. Try a different URL.</p>';
        }
      }

      parseBtn.addEventListener('click', parseURL);
      fetchBtn.addEventListener('click', fetchHeaders);
      urlInput.addEventListener('keydown', function (e) { if (e.key === 'Enter') parseURL(); });
      var samples = [
        'https://github.com/bayhaqy/apps?tab=readme&q=search',
        'https://httpbin.org/status/200',
        'https://example.com/path?key=value&user=42',
        'https://cloudflare.com/cdn-cgi/trace'
      ];
      var si = 0;
      sampleBtn.addEventListener('click', function () { si = (si + 1) % samples.length; urlInput.value = samples[si]; parseURL(); });

      setTimeout(parseURL, 150);
    })();
  </script>
