<body data-app-name="Timestamp Converter">

  <script src="/apps/assets/app-shell.js?v=20260831b" data-app-name="Timestamp Converter"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var nowTs = $('#nowTs');
      var nowDate = $('#nowDate');
      var copyNowBtn = $('#copyNowBtn');
      var tsInput = $('#tsInput');
      var tsConvertBtn = $('#tsConvertBtn');
      var tsNowBtn = $('#tsNowBtn');
      var tsResult = $('#tsResult');
      var dateInput = $('#dateInput');
      var dateConvertBtn = $('#dateConvertBtn');
      var dateNowBtn = $('#dateNowBtn');
      var dateResult = $('#dateResult');

      function escapeHtml(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }
      function row(k, v) { return '<tr><td class="k">' + escapeHtml(k) + '</td><td class="v">' + escapeHtml(v) + '</td></tr>'; }

      function pad(n) { return n < 10 ? '0' + n : '' + n; }
      function toLocalISO(d) {
        // YYYY-MM-DD HH:mm:ss in the user's local timezone (not UTC).
        return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
          ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
      }

      function relativeTime(d) {
        var now = Date.now();
        var diff = (d.getTime() - now) / 1000; // seconds, positive = future
        var abs = Math.abs(diff);
        var units = [
          ['year',   31536000],
          ['month',   2592000],
          ['week',    604800],
          ['day',      86400],
          ['hour',      3600],
          ['minute',      60],
          ['second',       1]
        ];
        for (var i = 0; i < units.length; i++) {
          var name = units[i][0], size = units[i][1];
          if (abs >= size) {
            var n = Math.floor(abs / size);
            var label = n + ' ' + name + (n > 1 ? 's' : '');
            if (diff > 0) return 'in ' + label;
            if (n === 1 && name === 'second') return 'just now';
            return label + ' ago';
          }
        }
        return 'just now';
      }

      function tickNow() {
        var now = new Date();
        var ts = Math.floor(now.getTime() / 1000);
        nowTs.textContent = ts;
        nowDate.textContent = now.toUTCString() + ' · ' + relativeTime(now);
      }

      function detectAndConvert(raw) {
        raw = String(raw).trim();
        if (!raw) return null;
        if (!/^-?\d+$/.test(raw)) return null;
        // If 13 digits, treat as ms. If 10 digits, treat as seconds. Otherwise, heuristic.
        var num = parseInt(raw, 10);
        var ms;
        if (raw.length >= 13) ms = num;
        else if (raw.length >= 11) ms = num; // assume ms for 11-12 digit values
        else if (raw.length === 10) ms = num * 1000;
        else if (raw.length <= 9) ms = num * 1000; // small number — assume seconds
        else ms = num;
        // Sanity check: must be between year 1 and year 9999.
        var d = new Date(ms);
        if (isNaN(d.getTime())) return null;
        // If the date is more than ~300 years in the future and we assumed seconds, maybe it's ms.
        return d;
      }

      function convertTimestamp() {
        var raw = tsInput.value.trim();
        if (!raw) { tsResult.style.display = 'none'; return; }
        var d = detectAndConvert(raw);
        if (!d) {
          tsResult.style.display = 'block';
          tsResult.innerHTML = '<tbody><tr><td class="text-red">Invalid timestamp. Use digits only (e.g. 1773284400).</td></tr></tbody>';
          return;
        }
        var tsSec = Math.floor(d.getTime() / 1000);
        var tsMs  = d.getTime();
        var rows = '';
        rows += row('Detected unit', tsMs === tsSec * 1000 && String(raw).length <= 10 ? 'seconds' : 'milliseconds');
        rows += row('Seconds', tsSec);
        rows += row('Milliseconds', tsMs);
        rows += row('Local time', toLocalISO(d) + ' (' + Intl.DateTimeFormat().resolvedOptions().timeZone + ')');
        rows += row('UTC time', d.toUTCString());
        rows += row('ISO 8601', d.toISOString());
        rows += row('RFC 2822', d.toString());
        rows += row('Relative', relativeTime(d));
        tsResult.innerHTML = '<tbody>' + rows + '</tbody>';
        tsResult.style.display = 'block';
      }

      function convertDate() {
        var val = dateInput.value;
        if (!val) { dateResult.style.display = 'none'; return; }
        var d = new Date(val);
        if (isNaN(d.getTime())) {
          dateResult.innerHTML = '<tbody><tr><td class="text-red">Invalid date.</td></tr></tbody>';
          dateResult.style.display = 'block';
          return;
        }
        var tsSec = Math.floor(d.getTime() / 1000);
        var tsMs = d.getTime();
        var rows = '';
        rows += row('Seconds', tsSec);
        rows += row('Milliseconds', tsMs);
        rows += row('Local time', toLocalISO(d) + ' (' + Intl.DateTimeFormat().resolvedOptions().timeZone + ')');
        rows += row('UTC time', d.toUTCString());
        rows += row('ISO 8601', d.toISOString());
        rows += row('Relative', relativeTime(d));
        dateResult.innerHTML = '<tbody>' + rows + '</tbody>';
        dateResult.style.display = 'block';
      }

      function padLocal(n) { return (n < 10 ? '0' : '') + n; }
      function setNowDateInput() {
        var d = new Date();
        var local = d.getFullYear() + '-' + padLocal(d.getMonth() + 1) + '-' + padLocal(d.getDate()) +
          'T' + padLocal(d.getHours()) + ':' + padLocal(d.getMinutes());
        dateInput.value = local;
      }

      copyNowBtn.addEventListener('click', function () {
        window.copyText(nowTs.textContent).then(function (ok) { window.showToast(ok ? 'Copied' : 'Copy failed'); });
      });
      tsConvertBtn.addEventListener('click', convertTimestamp);
      tsInput.addEventListener('input', convertTimestamp);
      tsNowBtn.addEventListener('click', function () { tsInput.value = Math.floor(Date.now() / 1000); convertTimestamp(); });
      dateConvertBtn.addEventListener('click', convertDate);
      dateInput.addEventListener('input', convertDate);
      dateNowBtn.addEventListener('click', function () { setNowDateInput(); convertDate(); });

      // Init.
      tickNow();
      setInterval(tickNow, 1000);
      tsInput.value = Math.floor(Date.now() / 1000);
      convertTimestamp();
      setNowDateInput();
      convertDate();
    })();
  </script>
</body>
