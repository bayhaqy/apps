  <script src="/apps/assets/app-shell.js?v=20260831b" data-app-name="Case Converter"></script>
  <script>
  (function () {
    var $ = function (s) { return document.querySelector(s); };
    var inputText = $('#inputText');
    var outputText = $('#outputText');
    var resultCard = $('#resultCard');
    var resultLabel = $('#resultLabel');
    var inputStats = $('#inputStats');
    var outputStats = $('#outputStats');
    var convertGrid = $('#convertGrid');

    var CASES = [
      { id: 'camel', name: 'camelCase', example: 'helloWorld' },
      { id: 'pascal', name: 'PascalCase', example: 'HelloWorld' },
      { id: 'snake', name: 'snake_case', example: 'hello_world' },
      { id: 'kebab', name: 'kebab-case', example: 'hello-world' },
      { id: 'constant', name: 'CONSTANT_CASE', example: 'HELLO_WORLD' },
      { id: 'dot', name: 'dot.case', example: 'hello.world' },
      { id: 'path', name: 'path/case', example: 'hello/world' },
      { id: 'sentence', name: 'Sentence case', example: 'Hello world' },
      { id: 'title', name: 'Title Case', example: 'Hello World' },
      { id: 'alternating', name: 'aLtErNaTiNg', example: 'hElLo WoRlD' },
      { id: 'inverse', name: 'iNVERSE cASE', example: 'HELLO world' },
      { id: 'slug', name: 'URL Slug', example: 'hello-world' }
    ];

    // Build buttons
    convertGrid.innerHTML = CASES.map(function (c) {
      return '<button class="convert-btn" data-case="' + c.id + '" type="button">' +
        '<span>' + c.name + '</span><span class="example">' + c.example + '</span></button>';
    }).join('');

    function countStats(text) {
      var chars = text.length;
      var words = text.trim() ? text.trim().split(/\s+/).length : 0;
      return chars + ' chars \u00b7 ' + words + ' words';
    }

    inputText.addEventListener('input', function () {
      inputStats.textContent = countStats(inputText.value);
      detectCase();
    });

    function detectCase() {
      var v = inputText.value;
      if (!v.trim()) { document.querySelectorAll('.convert-btn').forEach(function(b){b.classList.remove('active');}); return; }
      var detected = null;
      if (/^[a-z]+([A-Z][a-z]*)*$/.test(v)) detected = 'camel';
      else if (/^[A-Z][a-z]+([A-Z][a-z]*)*$/.test(v)) detected = 'pascal';
      else if (/^[a-z][a-z0-9]*(_[a-z0-9]+)*$/.test(v)) detected = 'snake';
      else if (/^[a-z][a-z0-9]*(-[a-z0-9]+)*$/.test(v)) detected = 'kebab';
      else if (/^[A-Z][A-Z0-9]*(_[A-Z0-9]+)*$/.test(v)) detected = 'constant';
      else if (/^[a-z][a-z0-9]*(\.[a-z0-9]+)*$/.test(v)) detected = 'dot';
      else if (/^[a-z][a-z0-9]*(\/[a-z0-9]+)*$/.test(v)) detected = 'path';
      document.querySelectorAll('.convert-btn').forEach(function (b) {
        b.classList.toggle('active', b.getAttribute('data-case') === detected);
      });
    }

    function splitWords(text) {
      // Split on spaces, hyphens, underscores, dots, slashes
      var words = text.replace(/([a-z])([A-Z])/g, '$1\n$2')
        .replace(/([A-Z]+)([A-Z][a-z])/g, '$1\n$2')
        .replace(/[\s_\-./\\]+/g, '\n')
        .split('\n').filter(function (w) { return w.length > 0; });
      return words;
    }

    function convert(text, caseId) {
      var words = splitWords(text);
      if (words.length === 0) return '';
      var lower = words.map(function (w) { return w.toLowerCase(); });
      switch (caseId) {
        case 'camel':
          return lower.map(function (w, i) { return i === 0 ? w : w.charAt(0).toUpperCase() + w.slice(1); }).join('');
        case 'pascal':
          return lower.map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join('');
        case 'snake':
          return lower.join('_');
        case 'kebab':
          return lower.join('-');
        case 'constant':
          return lower.join('_').toUpperCase();
        case 'dot':
          return lower.join('.');
        case 'path':
          return lower.join('/');
        case 'sentence':
          return text.charAt(0).toUpperCase() + text.slice(1).replace(/([.!?]\s+)([a-z])/g, function (m, p, l) { return p + l.toUpperCase(); });
        case 'title':
          return lower.map(function (w) { return w.charAt(0).toUpperCase() + w.slice(1); }).join(' ');
        case 'alternating':
          var result = '';
          for (var i = 0; i < text.length; i++) {
            result += i % 2 === 0 ? text[i].toLowerCase() : text[i].toUpperCase();
          }
          return result;
        case 'inverse':
          var inv = '';
          for (var j = 0; j < text.length; j++) {
            inv += text[j] === text[j].toUpperCase() ? text[j].toLowerCase() : text[j].toUpperCase();
          }
          return inv;
        case 'slug':
          return lower.join('-').replace(/[^a-z0-9-]/g, '').replace(/-+/g, '-').replace(/^-|-$/g, '');
        default: return text;
      }
    }

    convertGrid.addEventListener('click', function (e) {
      var btn = e.target.closest('.convert-btn');
      if (!btn) return;
      var caseId = btn.getAttribute('data-case');
      var caseInfo = CASES.find(function (c) { return c.id === caseId; });
      var text = inputText.value;
      if (!text.trim()) { showToast('Enter some text first'); return; }
      var result = convert(text, caseId);
      resultLabel.textContent = caseInfo ? caseInfo.name : 'Result';
      outputText.textContent = result;
      outputStats.textContent = countStats(result);
      resultCard.style.display = 'block';
      resultCard.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    });

    $('#swapBtn').addEventListener('click', function () {
      inputText.value = outputText.textContent;
      inputText.dispatchEvent(new Event('input'));
      showToast('Swapped to input');
    });

    $('#downloadBtn').addEventListener('click', function () {
      downloadText('case-converted.txt', outputText.textContent);
    });
  })();
  </script>
</body>
