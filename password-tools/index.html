<body data-app-name="Password Tools">
  <main class="app-main narrow">
    <header class="app-hero">

    <section class="card">

  <script src="/apps/assets/app-shell.js?v=20260831b" data-app-name="Password Tools"></script>
  <script>
    (function () {
      var $ = function (s) { return document.querySelector(s); };
      var lenRange = $('#lenRange');
      var lenLabel = $('#lenLabel');
      var useUpper = $('#useUpper');
      var useLower = $('#useLower');
      var useDigits = $('#useDigits');
      var useSymbols = $('#useSymbols');
      var useAmbiguous = $('#useAmbiguous');
      var generatedOut = $('#generatedOut');
      var copyBtn = $('#copyBtn');
      var regenBtn = $('#regenBtn');
      var genStrengthBar = $('#genStrengthBar');
      var genStrengthLabel = $('#genStrengthLabel');
      var genEntropyPill = $('#genEntropyPill');
      var testInput = $('#testInput');
      var testStrengthBar = $('#testStrengthBar');
      var testStrengthLabel = $('#testStrengthLabel');
      var testEntropyPill = $('#testEntropyPill');
      var testDetails = $('#testDetails');
      var toggleVisBtn = $('#toggleVisBtn');

      var SETS = {
        upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ',
        lower: 'abcdefghijklmnopqrstuvwxyz',
        digits: '0123456789',
        symbols: '!@#$%^&*()_+-=[]{}|;:,.<>?/~'
      };
      var AMBIGUOUS = '0O1lI|`';

      function secureRandomInt(maxExclusive) {
        // Reject modulo bias. maxExclusive must be <= 256.
        if (maxExclusive > 256) throw new Error('maxExclusive too large');
        var buf = new Uint8Array(1);
        var limit = Math.floor(256 / maxExclusive) * maxExclusive;
        while (true) {
          crypto.getRandomValues(buf);
          if (buf[0] < limit) return buf[0] % maxExclusive;
        }
      }

      function buildPool() {
        var pool = '';
        var required = [];
        if (useUpper.checked)   { pool += SETS.upper;   required.push(SETS.upper); }
        if (useLower.checked)   { pool += SETS.lower;   required.push(SETS.lower); }
        if (useDigits.checked)  { pool += SETS.digits;  required.push(SETS.digits); }
        if (useSymbols.checked) { pool += SETS.symbols; required.push(SETS.symbols); }
        if (useAmbiguous.checked) {
          pool = pool.split('').filter(function (c) { return AMBIGUOUS.indexOf(c) === -1; }).join('');
          required = required.map(function (s) {
            return s.split('').filter(function (c) { return AMBIGUOUS.indexOf(c) === -1; }).join('');
          });
        }
        return { pool: pool, required: required };
      }

      function generate() {
        var len = parseInt(lenRange.value, 10);
        var built = buildPool();
        var pool = built.pool;
        var required = built.required;
        if (!pool) { generatedOut.textContent = '(select at least one character set)'; return; }
        var out = '';
        // Guarantee at least one from each required set.
        for (var i = 0; i < required.length && i < len; i++) {
          var s = required[i];
          if (!s) continue;
          out += s[secureRandomInt(s.length)];
        }
        while (out.length < len) {
          out += pool[secureRandomInt(pool.length)];
        }
        // Shuffle (Fisher-Yates with crypto randomness).
        var arr = out.split('');
        for (var i = arr.length - 1; i > 0; i--) {
          var j = secureRandomInt(i + 1);
          var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
        }
        out = arr.join('');
        generatedOut.textContent = out;
        updateStrength(out, genStrengthBar, genStrengthLabel, genEntropyPill, null);
      }

      function entropyBits(password, poolSize) {
        if (!password) return 0;
        var len = password.length;
        // log2(poolSize^len) = len * log2(poolSize)
        return len * Math.log2(poolSize || 1);
      }

      function classify(entropy) {
        if (entropy < 28) return { name: 'Very weak', cls: 'weak', pct: 20 };
        if (entropy < 36) return { name: 'Weak',      cls: 'weak', pct: 40 };
        if (entropy < 60) return { name: 'Fair',      cls: 'fair', pct: 60 };
        if (entropy < 100) return { name: 'Strong',   cls: 'strong', pct: 80 };
        return { name: 'Very strong', cls: 'very-strong', pct: 100 };
      }

      function analyzePassword(pw) {
        // Determine the actual pool size by detecting which sets are used.
        var hasUpper = /[A-Z]/.test(pw), hasLower = /[a-z]/.test(pw);
        var hasDigit = /[0-9]/.test(pw), hasSym = /[^A-Za-z0-9]/.test(pw);
        var poolSize = 0;
        if (hasUpper) poolSize += 26;
        if (hasLower) poolSize += 26;
        if (hasDigit) poolSize += 10;
        if (hasSym)   poolSize += 32;
        if (poolSize === 0) poolSize = 1;
        return {
          entropy: entropyBits(pw, poolSize),
          poolSize: poolSize,
          hasUpper: hasUpper, hasLower: hasLower, hasDigit: hasDigit, hasSym: hasSym,
          len: pw.length
        };
      }

      function updateStrength(pw, bar, label, pill, detailsEl) {
        var a = analyzePassword(pw);
        var c = classify(a.entropy);
        bar.className = 'strength-bar ' + c.cls;
        bar.querySelector('div').style.width = c.pct + '%';
        label.textContent = c.name;
        label.style.color = c.cls === 'weak' ? '#DC2626' : c.cls === 'fair' ? '#B45309' : '#047857';
        pill.textContent = Math.round(a.entropy) + ' bits';
        if (detailsEl) {
          var parts = [];
          parts.push('Length: ' + a.len);
          parts.push('Pool size: ' + a.poolSize);
          var checks = [];
          if (a.hasUpper) checks.push('A-Z'); if (a.hasLower) checks.push('a-z');
          if (a.hasDigit) checks.push('0-9'); if (a.hasSym)   checks.push('!@#');
          parts.push('Classes used: ' + (checks.join(' ') || 'none'));
          // Time-to-crack (rough): assume 10^10 guesses/sec offline attack on SHA-256.
          var guesses = Math.pow(2, a.entropy);
          var seconds = guesses / 1e10;
          var crack = formatDuration(seconds);
          parts.push('Est. offline crack time: ' + crack);
          detailsEl.innerHTML = parts.map(escapeHtml).join(' · ');
        }
      }

      function formatDuration(sec) {
        if (!isFinite(sec) || sec <= 0) return 'instant';
        if (sec < 1) return '< 1 second';
        var units = [
          ['year', 31536000], ['day', 86400], ['hour', 3600], ['minute', 60], ['second', 1]
        ];
        var parts = [];
        for (var i = 0; i < units.length; i++) {
          var name = units[i][0], size = units[i][1];
          var n = Math.floor(sec / size);
          if (n > 0) { parts.push(n + ' ' + name + (n > 1 ? 's' : '')); sec -= n * size; }
          if (parts.length >= 3) break;
        }
        if (parts.length === 0) return '< 1 second';
        if (parts.length === 1 && /year/.test(parts[0])) {
          var years = parseInt(parts[0]);
          if (years > 1e9) return '> ' + (years / 1e9).toFixed(1) + ' billion years';
          if (years > 1e6) return '> ' + (years / 1e6).toFixed(1) + ' million years';
        }
        return parts.join(' ');
      }

      function escapeHtml(s) { return String(s).replace(/[&<>"']/g, function (c) { return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c]; }); }

      // Events.
      lenRange.addEventListener('input', function () { lenLabel.textContent = lenRange.value; generate(); });
      [useUpper, useLower, useDigits, useSymbols, useAmbiguous].forEach(function (cb) {
        cb.addEventListener('change', generate);
      });
      regenBtn.addEventListener('click', generate);
      copyBtn.addEventListener('click', function () {
        var v = generatedOut.textContent;
        if (!v || v === '—') return;
        window.copyText(v).then(function (ok) { window.showToast(ok ? 'Copied' : 'Copy failed'); });
      });
      testInput.addEventListener('input', function () {
        updateStrength(testInput.value, testStrengthBar, testStrengthLabel, testEntropyPill, testDetails);
      });
      var visible = true;
      toggleVisBtn.addEventListener('click', function () {
        visible = !visible;
        testInput.type = visible ? 'text' : 'password';
        toggleVisBtn.textContent = visible ? 'eye' : 'eye-off';
      });

      // Initial.
      generate();
      updateStrength('', testStrengthBar, testStrengthLabel, testEntropyPill, testDetails);
    })();
  </script>
